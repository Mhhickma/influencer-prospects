name: Notify Dashboard Creator CSV Update

on:
  push:
    branches: [main]
    paths:
      - "creator-connections/**/*.csv"
  workflow_dispatch:

jobs:
  notify-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Dashboard scan
        env:
          DASHBOARD_DISPATCH_TOKEN: ${{ secrets.DASHBOARD_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DASHBOARD_DISPATCH_TOKEN" ]; then
            echo "Missing DASHBOARD_DISPATCH_TOKEN secret. Add a fine-grained GitHub token with Actions write access to Mhhickma/Dashboard."
            exit 1
          fi

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DASHBOARD_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Mhhickma/Dashboard/dispatches \
            -d '{"event_type":"creator-campaigns-updated"}'
