<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProspectDash</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f4f4f8;--surface:#fff;--surface2:#f0f0f5;--border:#e0e0ea;
    --accent:#6457e8;--accent2:#e8874a;--green:#16a34a;--red:#dc2626;
    --yellow:#d97706;--text:#1a1a2e;--muted:#7070a0;
    --mono:'DM Mono',monospace;--sans:'Syne',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
  header{border-bottom:1px solid var(--border);padding:20px 40px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);position:sticky;top:0;z-index:10}
  .logo{font-size:16px;font-weight:800;letter-spacing:-.3px}
  .logo span{color:var(--accent)}
  .header-stats{display:flex;gap:24px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .header-stats strong{color:var(--text)}
  .cc-notice{background:rgba(100,87,232,.08);border-bottom:1px solid rgba(100,87,232,.18);padding:12px 40px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .cc-notice strong{color:var(--accent)}
  .status-bar{background:var(--surface2);border-bottom:1px solid var(--border);padding:10px 40px;display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted)}
  #import-status{color:var(--green)}
  #scan-summary{padding:10px 40px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface)}
  .scan-panel{padding:14px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface)}
  .scan-panel label{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .scan-panel input{width:86px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-family:var(--mono);font-size:12px;outline:none}
  .scan-panel input:focus{border-color:var(--accent)}
  .scan-status{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .controls{padding:24px 40px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border)}
  .filter-btn{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 16px;color:var(--muted);font-family:var(--mono);font-size:12px;cursor:pointer;transition:all .2s}
  .filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(100,87,232,.08)}
  .search-wrap{margin-left:auto;position:relative}
  .search-wrap input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 14px 7px 32px;color:var(--text);font-family:var(--mono);font-size:12px;outline:none;width:200px;transition:border-color .2s}
  .search-wrap input:focus{border-color:var(--accent)}
  .search-wrap::before{content:'search';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--mono);font-size:9px;pointer-events:none}
  .search-wrap input{padding-left:54px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;padding:32px 40px}
  .section-heading{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;margin:4px 0 2px}
  .section-heading h2{font-size:18px;font-weight:800;letter-spacing:-.2px}
  .section-heading span{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:transform .2s,border-color .2s;animation:fadeUp .4s ease both}
  .card.ideal{border-color:rgba(22,163,74,.40);box-shadow:0 0 0 1px rgba(22,163,74,.08)}
  .card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 24px rgba(100,87,232,.12)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .card-img{width:100%;height:180px;object-fit:contain;background:var(--surface2);padding:16px;border-bottom:1px solid var(--border)}
  .card-img-placeholder{width:100%;height:180px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:32px}
  .card-body{padding:18px}
  .card-brand{font-size:11px;font-family:var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  .card-title{font-size:14px;font-weight:600;line-height:1.4;margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
  .metric{background:var(--surface2);border-radius:8px;padding:10px 12px}
  .metric-label{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .metric-value{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--text)}
  .metric-value.green{color:var(--green)}.metric-value.red{color:var(--red)}.metric-value.yellow{color:var(--yellow)}
  .metric-value.trend-up{color:var(--green)}
  .metric-value.trend-down{color:var(--red)}
  .metric-value.trend-stable{color:var(--yellow)}
  .trend-badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}
  .trend-growing{background:rgba(22,163,74,.10);color:var(--green);border:1px solid rgba(22,163,74,.25)}
  .trend-declining{background:rgba(220,38,38,.10);color:var(--red);border:1px solid rgba(220,38,38,.25)}
  .trend-stable{background:rgba(217,119,6,.10);color:var(--yellow);border:1px solid rgba(217,119,6,.25)}
  .accel-tag,.new-tag{font-family:var(--mono);font-size:10px;border-radius:4px;padding:2px 7px;display:inline-block;margin-left:6px}
  .accel-tag{color:var(--accent2);background:rgba(232,135,74,.1);border:1px solid rgba(232,135,74,.25)}
  .new-tag{color:var(--green);background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.25)}
  .loose-tag{font-family:var(--mono);font-size:10px;border-radius:4px;padding:2px 7px;display:inline-block;margin-left:6px;color:var(--yellow);background:rgba(217,119,6,.1);border:1px solid rgba(217,119,6,.25)}
  .misses{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:10px;line-height:1.4}
  .card-footer{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
  .btn{flex:1;padding:8px;border-radius:7px;font-family:var(--mono);font-size:11px;text-align:center;text-decoration:none;font-weight:500;transition:opacity .2s;cursor:pointer;border:none}
  .btn:hover{opacity:.8}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-secondary{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
  .empty{grid-column:1/-1;text-align:center;padding:80px;color:var(--muted);font-family:var(--mono);font-size:14px}
</style>
</head>
<body>

<header>
  <div class="logo">Prospect<span>Dash</span></div>
  <div class="header-right"><nav class="dashboard-nav" aria-label="Dashboard pages"><a class="active" href="influencer_prospects.html">Prospects</a><a href="influencer_video_opportunities.html">Video Opportunities</a></nav><div class="header-stats">
    <span>Total: <strong id="stat-total">0</strong></span>
    <span>Avg Revenue: <strong id="stat-avg">$0</strong></span>
    <span>Growing: <strong id="stat-growing">0</strong></span>
  </div></div></header>
<div class="cc-notice">Creator Connections CSV last updated: <strong id="cc-last-updated">Loading...</strong></div>

<div class="status-bar">
  <span id="import-status">Loading prospects...</span>
  <span id="last-updated"></span>
</div>
<div id="scan-summary"></div>
<div class="scan-panel">
  <label for="scan-token-budget">Keepa Tokens</label>
  <input id="scan-token-budget" type="number" min="10" max="1500" step="10" value="200">
  <button class="btn btn-primary" type="button" onclick="openScanWorkflow()">Run Scan</button>
  <span class="scan-status" id="scan-status"></span>
</div>

<div class="controls">
  <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" onclick="setFilter('ideal',this)">Ideal Only</button>
  <button class="filter-btn" onclick="setFilter('highCommission',this)">High Commission</button>
  <button class="filter-btn" onclick="setFilter('new90',this)">New 90 Days</button>
  <button class="filter-btn" onclick="setFilter('Growing',this)">Growing</button>
  <button class="filter-btn" onclick="setFilter('Stable',this)">Stable</button>
  <button class="filter-btn" onclick="setFilter('Declining',this)">Declining</button>
  <button class="filter-btn" onclick="setFilter('accelerating',this)">Accelerating</button>
  <div class="search-wrap">
    <input type="text" placeholder="search brand or title..." oninput="searchCards(this.value)">
  </div>
</div>

<div class="grid" id="card-grid"></div>

<script>
let prospects = [];
let activeFilter = 'all';
let searchTerm = '';

async function loadData() {
  try {
    const res = await fetch('data.json?t=' + Date.now());
    if (!res.ok) throw new Error('No data');
    const json = await res.json();
    prospects = json.prospects || [];
    const idealCount = json.total_ideal ?? prospects.filter(p => p.is_ideal).length;
    const looseCount = json.total_loose ?? prospects.filter(p => !p.is_ideal).length;
    const lastScanDate = formatEasternTime(json.last_updated);
    const creatorFileDate = json.creator_connections_last_updated
      ? ` | Creator file updated: ${formatEasternTime(json.creator_connections_last_updated)}`
      : '';
    document.getElementById('cc-last-updated').textContent = formatEasternTime(json.creator_connections_last_updated) || 'Not available';
    document.getElementById('import-status').textContent = `${prospects.length} prospects loaded (${idealCount} ideal, ${looseCount} loose)`;
    document.getElementById('last-updated').textContent = `Last scan: ${lastScanDate || ''}${creatorFileDate}`;
    renderScanSummary(json);
    renderCards(prospects);
  } catch(e) {
    document.getElementById('import-status').style.color = 'var(--yellow)';
    document.getElementById('import-status').textContent = 'No data yet - run the GitHub Actions workflow first.';
    document.getElementById('cc-last-updated').textContent = 'Not available';
  }
}

function renderScanSummary(json) {
  const summary = document.getElementById('scan-summary');
  const skipCounts = json.skip_counts || {};
  const topReject = Object.entries(skipCounts).sort((a,b) => b[1] - a[1])[0];
  const campaignAsins = json.creator_connection_asins_loaded || 0;
  const finderCandidates = json.product_finder_candidates || 0;
  const matched = json.creator_connection_matches || 0;
  const returned = json.keepa_products_returned || 0;
  const rejectText = topReject ? ` | top rejection: ${formatRejectReason(topReject[0])} (${topReject[1]})` : '';
  summary.textContent = `Campaign ASINs loaded: ${campaignAsins.toLocaleString()} | Product Finder candidates: ${finderCandidates.toLocaleString()} | Campaign matches checked: ${matched} | Keepa products returned: ${returned}${rejectText}`;
}

function formatRejectReason(reason) {
  return String(reason || '').replaceAll('_', ' ');
}

function formatEasternTime(value) {
  if (!value) return '';
  const raw = String(value).trim();
  const iso = raw.endsWith('Z') || /[+-]\d{2}:?\d{2}$/.test(raw) ? raw : raw.replace(' UTC', '') + 'Z';
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return raw.replace(' UTC', ' ET');
  return new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: 'numeric',
    minute: '2-digit',
    timeZoneName: 'short'
  }).format(date);
}

function openScanWorkflow() {
  const input = document.getElementById('scan-token-budget');
  const status = document.getElementById('scan-status');
  const budget = Math.max(10, Math.min(1500, Number(input.value || 200)));
  input.value = budget;
  const text = String(budget);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).catch(() => {});
  }
  status.textContent = `Copied ${text}. Paste it into token_budget.`;
  window.open('https://github.com/Mhhickma/influencer-prospects/actions/workflows/fetch.yml', '_blank');
}

function commissionValue(p) {
  const raw = (p.creator_connection_campaign || {}).commission_rate || '';
  const value = parseFloat(String(raw).replace('%', ''));
  return Number.isFinite(value) ? value : 0;
}

function renderCards(data) {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';
  const filtered = data.filter(p => {
    const mf = activeFilter === 'all'
      ? true
      : activeFilter === 'ideal'
        ? p.is_ideal
      : activeFilter === 'highCommission'
        ? commissionValue(p) >= 15
      : activeFilter === 'accelerating'
        ? p.accelerating
        : activeFilter === 'new90'
          ? p.is_new_90
          : p.sales_trend === activeFilter;
    const ms = searchTerm === '' ? true : (p.brand||'').toLowerCase().includes(searchTerm)||(p.title||'').toLowerCase().includes(searchTerm)||(p.asin||'').toLowerCase().includes(searchTerm);
    return mf && ms;
  });
  document.getElementById('stat-total').textContent = filtered.length;
  const avg = filtered.length ? Math.round(filtered.reduce((s,p)=>s+(p.monthly_revenue||0),0)/filtered.length) : 0;
  document.getElementById('stat-avg').textContent = '$'+avg.toLocaleString();
  document.getElementById('stat-growing').textContent = filtered.filter(p=>p.sales_trend==='Growing').length;
  if (!filtered.length) { grid.innerHTML='<div class="empty">no prospects match this filter</div>'; return; }

  const ordered = filtered.slice().sort((a,b) => {
    if (Boolean(a.is_ideal) !== Boolean(b.is_ideal)) return a.is_ideal ? -1 : 1;
    if ((b.opportunity_score || 0) !== (a.opportunity_score || 0)) return (b.opportunity_score || 0) - (a.opportunity_score || 0);
    if ((b.monthly_revenue || 0) !== (a.monthly_revenue || 0)) return (b.monthly_revenue || 0) - (a.monthly_revenue || 0);
    return (a.age_days ?? 999999) - (b.age_days ?? 999999);
  });
  const groups = [
    {title:'Ideal Products', note:'matches every rule', items: ordered.filter(p => p.is_ideal)},
    {title:'Loose Matches', note:'near misses worth reviewing', items: ordered.filter(p => !p.is_ideal)}
  ].filter(group => group.items.length);

  let cardIndex = 0;
  groups.forEach(group => {
    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.innerHTML = `<h2>${group.title}</h2><span>${group.items.length} ${group.note}</span>`;
    grid.appendChild(heading);

  group.items.forEach((p) => {
    const trendClass = p.sales_trend==='Growing'?'trend-growing':p.sales_trend==='Declining'?'trend-declining':'trend-stable';
    const trendIcon = p.sales_trend==='Growing'?'up':p.sales_trend==='Declining'?'down':'stable';
    const trendSign = (p.sales_trend_pct||0)>0?'+':'';
    const trendValueClass = p.sales_trend==='Growing'?'trend-up':p.sales_trend==='Declining'?'trend-down':'trend-stable';
    const trendLabel = p.sales_trend==='Growing'?'Increasing':p.sales_trend==='Declining'?'Decreasing':'Steady';
    const ratingColor = (p.rating||0)>=4.5?'green':(p.rating||0)>=4.0?'yellow':'red';
    const d90 = p.sales_rank_drops_90||0;
    const d30 = p.sales_rank_drops_30||0;
    const inf = p.influencer_count||0;
    const mainVideos = p.main_video_count||0;
    const otherVideos = p.other_video_count||0;
    const totalVideos = p.video_count ?? (mainVideos + inf + otherVideos);
    const ageLabel = p.age_days === null || p.age_days === undefined ? '-' : `${p.age_days}d`;
    const infColor = inf===0?'var(--green)':inf<=6?'var(--yellow)':'var(--red)';
    const infLabel = inf===0?'none yet':inf===1?'1 so far':inf+' so far';
    const creatorCampaign = p.creator_connection_campaign || {};
    const creatorCampaignLabel = p.creator_connection
      ? (creatorCampaign.commission_rate ? creatorCampaign.commission_rate : 'matched')
      : 'No';
    const campaignDaysLeft = getCampaignDaysLeft(creatorCampaign.campaign_end_date);
    const campaignDaysLabel = formatCampaignDaysLeft(campaignDaysLeft);
    const campaignDaysColor = campaignDaysLeft === null
      ? ''
      : campaignDaysLeft < 0
        ? 'red'
        : campaignDaysLeft <= 7
          ? 'yellow'
          : 'green';
    const missedReasons = (p.missed_ideal_reasons || []).join(', ');

    const card = document.createElement('div');
    card.className = `card ${p.is_ideal ? 'ideal' : 'loose'}`;
    card.style.animationDelay = `${cardIndex*0.05}s`;
    cardIndex += 1;
    card.innerHTML = `
      ${imageMarkup(p)}
      <div class="card-body">
        <div class="card-brand">${p.brand||''}</div>
        <div class="card-title">${p.title||''}</div>
        <div class="card-metrics">
          <div class="metric">
            <div class="metric-label">Units/mo</div>
            <div class="metric-value">${(p.monthly_units||0).toLocaleString()}</div>
          </div>
          <div class="metric">
            <div class="metric-label">Revenue/mo</div>
            <div class="metric-value green">$${(p.monthly_revenue||0).toLocaleString()}</div>
          </div>
          <div class="metric">
            <div class="metric-label">Price</div>
            <div class="metric-value">$${p.buybox_price||0}</div>
          </div>
          <div class="metric">
            <div class="metric-label">Score</div>
            <div class="metric-value ${p.is_ideal?'green':'yellow'}">${p.opportunity_score ?? 0}/100</div>
          </div>
          <div class="metric">
            <div class="metric-label">Age</div>
            <div class="metric-value ${p.is_new_90?'green':''}">${ageLabel}</div>
          </div>
          <div class="metric">
            <div class="metric-label">Rating</div>
            <div class="metric-value ${ratingColor}">${p.rating||'-'} <span style="color:var(--muted);font-size:10px">(${(p.review_count||0).toLocaleString()})</span></div>
          </div>
          <div class="metric">
            <div class="metric-label">Influencer Vids</div>
            <div class="metric-value" style="color:${infColor}">${infLabel}</div>
          </div>
          <div class="metric">
            <div class="metric-label">90d Sales Trend</div>
            <div class="metric-value ${trendValueClass}">${trendLabel} ${trendSign}${p.sales_trend_pct||0}%</div>
          </div>
          <div class="metric">
            <div class="metric-label">Creator Campaign</div>
            <div class="metric-value ${p.creator_connection?'green':'red'}">${creatorCampaignLabel}</div>
          </div>
          <div class="metric">
            <div class="metric-label">CC Days Left</div>
            <div class="metric-value ${campaignDaysColor}">${campaignDaysLabel}</div>
          </div>
          <div class="metric">
            <div class="metric-label">Video Count</div>
            <div class="metric-value">${totalVideos}</div>
          </div>
          <div class="metric">
            <div class="metric-label">Main Vids</div>
            <div class="metric-value">${mainVideos}</div>
          </div>
          <div class="metric">
            <div class="metric-label">Other Vids</div>
            <div class="metric-value">${otherVideos}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="trend-badge ${trendClass}">${trendIcon} ${p.sales_trend} ${trendSign}${p.sales_trend_pct||0}%</span>
          ${p.is_ideal?'<span class="new-tag">ideal</span>':'<span class="loose-tag">loose match</span>'}
          ${p.creator_connection?'<span class="new-tag">creator campaign</span>':''}
          ${p.is_new_90?'<span class="new-tag">new 90d</span>':''}
          ${p.accelerating?'<span class="accel-tag">accelerating</span>':''}
        </div>
        ${!p.is_ideal && missedReasons ? `<div class="misses">Misses ideal: ${missedReasons}</div>` : ''}
        <div class="card-footer">
          <a class="btn btn-primary" href="${p.amazon_url||'#'}" target="_blank">View Listing</a>
          <a class="btn btn-secondary" href="${p.brand_store_url||'#'}" target="_blank">Brand Store</a>
        </div>
      </div>`;
    grid.appendChild(card);
  });
  });
}

function imageCandidates(p) {
  const asin = p.asin || '';
  const candidates = [];
  if (p.image_url) candidates.push(p.image_url);
  if (asin) {
    candidates.push(`https://m.media-amazon.com/images/P/${asin}.01._SL500_.jpg`);
    candidates.push(`https://images-na.ssl-images-amazon.com/images/P/${asin}.01._SL500_.jpg`);
    candidates.push(`https://ws-na.amazon-adsystem.com/widgets/q?_encoding=UTF8&MarketPlace=US&ASIN=${asin}&ServiceVersion=20070822&ID=AsinImage&WS=1&Format=_SL500_`);
  }
  return [...new Set(candidates.filter(Boolean))];
}

function proxiedImageUrl(url) {
  return `https://images.weserv.nl/?url=${encodeURIComponent(url)}&w=500&output=webp`;
}

function tryNextImage(img) {
  const candidates = JSON.parse(decodeURIComponent(img.dataset.imageCandidates || '%5B%5D'));
  const nextIndex = Number(img.dataset.imageIndex || 0) + 1;
  if (nextIndex < candidates.length) {
    img.dataset.imageIndex = String(nextIndex);
    img.src = proxiedImageUrl(candidates[nextIndex]);
    return;
  }

  img.style.display = 'none';
  img.nextElementSibling.style.display = 'flex';
}

function imageMarkup(p) {
  const candidates = imageCandidates(p);
  const encodedCandidates = encodeURIComponent(JSON.stringify(candidates));
  const firstImage = candidates[0] || '';
  const imgHtml = firstImage
    ? `<img class="card-img" src="${proxiedImageUrl(firstImage)}" alt="${p.brand||''}" data-image-index="0" data-image-candidates="${encodedCandidates}" onerror="tryNextImage(this)">`
    : '';
  const placeholderStyle = firstImage ? 'style="display:none"' : '';
  return `${imgHtml}<div class="card-img-placeholder" ${placeholderStyle}>No image</div>`;
}

function setFilter(f,btn) {
  activeFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderCards(prospects);
}

function getCampaignDaysLeft(endDateValue) {
  if (!endDateValue) return null;
  const match = String(endDateValue).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!match) return null;
  const endUtc = Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
  const today = getEasternTodayUtc();
  return Math.ceil((endUtc - today) / 86400000);
}

function getEasternTodayUtc() {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).formatToParts(new Date());
  const byType = Object.fromEntries(parts.map(part => [part.type, part.value]));
  return Date.UTC(Number(byType.year), Number(byType.month) - 1, Number(byType.day));
}

function formatCampaignDaysLeft(days) {
  if (days === null || days === undefined) return '-';
  if (days < 0) return 'ended';
  if (days === 0) return 'ends today';
  if (days === 1) return '1 day';
  return `${days} days`;
}
